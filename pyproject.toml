[project]
name = "ai-notebooks"
version = "0.1.0"
description = "A collection of Jupyter notebooks for various aspects of AI."
requires-python = ">=3.11"
dependencies = [
    "scikit-learn>=1.6.0",
    "numpy>=2.0.0",
    "pandas>=2.3.0",
    "scipy>=1.14.0",
    "matplotlib>=3.11.0",
    "seaborn>=0.13.0",
    "pydantic>=2.13.0",
    "hf-xet>=1.6.0",
    "kaggle>=2.2.0",
    "docling[vlm]>=2.130.0",
    "torch>=2.13.0",
    "torchvision>=0.28.0"
]

# Define the CUDA index
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

# Route torch to the CUDA index
[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[dependency-groups]
dev = [
    "ruff>=0.16.6"
]

[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # Pyflakes
    "I",      # isort — import sorting (also enabled below)
    "W",      # pycodestyle warnings
    "UP",     # pyupgrade — auto-upgrade to newer Python syntax
]
ignore = [
    "E501",   # let the formatter handle line length
]
